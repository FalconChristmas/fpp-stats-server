version: '3'

volumes:
  statsdata:
     driver: local
  github:
     driver: local

services:
  fpp-stats-api:
    build: server/.
    restart: always
    volumes: 
      - statsdata:/statsdata
      - github:/github
    environment: 
      - out_dir=/statsdata
      - GITHUB_CACHE_DIR=/github
    env_file:
    - my.env
    ports:
       - '127.0.0.1:7666:7654'
  fpp-stats-collect:
    build: statsCollector/.
    restart: always
    # Page cache counts against this limit, so reading the whole corpus for the
    # scrub and archive recycles the collector's own cache instead of evicting
    # the rest of the host's.  blkio weight (10-1000, default 500) only applies
    # under the bfq IO scheduler.
    mem_limit: 512m
    blkio_config:
      weight: 100
    volumes: 
      - statsdata:/statsdata
    environment: 
      - out_dir=/statsdata
